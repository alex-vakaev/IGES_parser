services:
  iges-parser:
    build: .
    expose:
      - "8000"  # порт доступен только внутри Docker-сети, не снаружи
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"   # HTTP — снаружи доступен порт 80, без указания порта в URL
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - iges-parser
    restart: always
