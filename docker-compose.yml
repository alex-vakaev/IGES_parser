services:
  iges-parser:
    build: .
    ports:
      - "127.0.0.1:8000:8000"  # слушаем только localhost — доступ снаружи через Nginx
    env_file:
      - .env
    restart: always
    # healthcheck позволяет Docker автоматически перезапустить контейнер при зависании
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M        # защита от утечки памяти
